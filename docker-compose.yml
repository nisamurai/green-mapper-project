services:
  postgres:
    restart: unless-stopped
    image: postgres:17.4-alpine
    env_file:
      - .env
    ports:
      - 5252:5432
    volumes:
      - ./backend/.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  redis:
    restart: unless-stopped
    image: redis:8.4.2-alpine
    container_name: redis
    ports:
      - 6379:6379
    volumes:
      - ./backend/.data/redis:/data
    command: redis-server --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: "$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    depends_on:
      - postgres

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4.2.4-alpine
    container_name: rabbitmq
    ports:
      - 5672:5672   # AMQP protocol port
    environment:
      RABBITMQ_DEFAULT_USER: "$RABBITMQ_USER"
      RABBITMQ_DEFAULT_PASS: "$RABBITMQ_PASSWORD"
    volumes:
      - ./backend/.data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
  
  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      IN_CONTAINER: true
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - backend
    # healthcheck:
    # test: ["CMD", "curl", "-f", "http://localhost:8080/health"] # !!! внутри нет эндпоинта
    #   interval: 10s
    #   retries: 5
    #   start_period: 10s
    #   timeout: 10s

  backend:
    restart: unless-stopped
    build: ./backend
    environment:
      IN_CONTAINER: true # не трогать!!!
    env_file:
      - .env
    ports:
      - 3000:3000
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://0.0.0.0:3000/health || exit 1"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  minio:
    restart: unless-stopped
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: "$MINIO_ROOT_USER"
      MINIO_ROOT_PASSWORD: "$MINIO_ROOT_PASSWORD"
    volumes:
      - ./backend/.data/mimiro:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        VITE_BETTER_AUTH_BASE_URL: "$VITE_BETTER_AUTH_BASE_URL"
        VITE_API_BASE_URL: "$VITE_API_BASE_URL"
        VITE_MINIO_BASE_URL: "$VITE_MINIO_BASE_URL"
    environment:
      VITE_BETTER_AUTH_BASE_URL: "$VITE_BETTER_AUTH_BASE_URL"
      VITE_API_BASE_URL: "$VITE_API_BASE_URL"
      VITE_MINIO_BASE_URL: "$VITE_MINIO_BASE_URL"
      CADDY_PROXY_URL: "$CADDY_PROXY_URL"
    ports:
      - '80:80'
    depends_on:
      - backend